<nz-card [nzTitle]="cardTitle" class="block w-full border-0 rounded-2xl">
  <ng-template #cardTitle>
    <p class="text-lg font-extrabold">أعدادات الحساب</p>
  </ng-template>
  <div>
    <ng-container [formGroup]="form">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <app-field placeholder="ادخل أسمك" formControlName="name" label="أسمك">
          <div>
            <button nz-button nzType="text" class="absolute top-1/2 left-4 -translate-y-1/2">
              <span nz-icon nzType="edit" class="text-gray-400 text-2xl" nzTheme="outline"></span>
            </button>
          </div>
        </app-field>
        <app-field
          placeholder="ادخل البريد الإلكتروني"
          formControlName="email"
          label="البريد الإلكتروني"
        >
          <div>
            <button nz-button nzType="text" class="absolute top-1/2 left-4 -translate-y-1/2">
              <span nz-icon nzType="edit" class="text-gray-400 text-2xl" nzTheme="outline"></span>
            </button>
          </div>
        </app-field>
      </div>
      <app-field
        placeholder="ادخل رقم الجوال"
        class="mt-6 block"
        formControlName="phone"
        label="رقم الجوال"
      >
        <div>
          <button nz-button nzType="text" class="absolute top-1/2 left-4 -translate-y-1/2">
            <span nz-icon nzType="edit" class="text-gray-400 text-2xl" nzTheme="outline"></span>
          </button>
        </div>
      </app-field>

      <div class="flex">
        <app-button class="mt-6 w-full md:w-auto">
          <span class="flex items-center">
            <span nz-icon class="text-lg me-1 leading-none" nzType="save" nzTheme="outline"></span>
            حفظ التغييرات
          </span>
        </app-button>
      </div>
    </ng-container>
  </div>
</nz-card>
