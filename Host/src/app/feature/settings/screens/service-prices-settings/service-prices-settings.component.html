<nz-card [nzTitle]="cardTitle" class="block w-full border-0 rounded-2xl">
  <ng-template #cardTitle>
    <p class="text-lg font-extrabold">أعدادات اسعار الخدمات</p>
  </ng-template>
  <div>
    <nz-tabset class="px-2 py-3">
      <nz-tab nzTitle="اسعار الخدمات في المناسبات">
        <app-prices-occasions></app-prices-occasions>
      </nz-tab>
      <nz-tab nzTitle="أسعار العروض">
        <app-offer-prices></app-offer-prices>
      </nz-tab>
      <nz-tab nzTitle="اسعار الاجازات">
        <app-vacation-prices></app-vacation-prices>
      </nz-tab>
    </nz-tabset>
  </div>
</nz-card>
