<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
  <div>
    <app-field-label label="نوع المناسبة"></app-field-label>
    <nz-select
      nzAllowClear
      nzPlaceHolder="برجاء تحديد نوع المناسبة .."
      class="xl-select w-full lg:min-w-[300px]"
    >
      <nz-option nzLabel="Jack" nzValue="jack"></nz-option>
      <nz-option nzLabel="Lucy" nzValue="lucy"></nz-option>
      <nz-option nzLabel="Tom" nzValue="tom"></nz-option>
    </nz-select>
  </div>
  <div>
    <app-field-label label="الخدمة المراد تطبيق العرض عليها"></app-field-label>
    <nz-select
      nzAllowClear
      nzPlaceHolder="برجاء تحديد الخدمة .."
      class="xl-select w-full lg:min-w-[300px]"
    >
      <nz-option nzLabel="Jack" nzValue="jack"></nz-option>
      <nz-option nzLabel="Lucy" nzValue="lucy"></nz-option>
      <nz-option nzLabel="Tom" nzValue="tom"></nz-option>
    </nz-select>
  </div>
</div>
<div class="grid grid-cols-1 gap-4 mt-4">
  <app-field label="حقل السعر" placeholder="برجاء أدخال السعر .."> </app-field>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
  <app-date-picker label="تاريخ ظهور السعر الجديد"></app-date-picker>
  <app-date-picker label="تاريخ ووقت المغادرة"></app-date-picker>
</div>

<div class="flex">
  <app-button class="mt-6 w-full md:w-auto">
    <span class="flex items-center">
      <span nz-icon class="text-lg me-1 leading-none" nzType="save" nzTheme="outline"></span>
      حفظ التغييرات
    </span>
  </app-button>
</div>
