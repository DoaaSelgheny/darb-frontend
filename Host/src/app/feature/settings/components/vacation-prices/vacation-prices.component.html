<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
  <div>
    <app-field-label label="الخدمة المراد تطبيق العرض عليها"></app-field-label>
    <nz-select
      nzAllowClear
      nzPlaceHolder="برجاء تحديد الخدمة .."
      class="xl-select w-full lg:min-w-[300px]"
    >
      <nz-option nzLabel="Jack" nzValue="jack"></nz-option>
      <nz-option nzLabel="Lucy" nzValue="lucy"></nz-option>
      <nz-option nzLabel="Tom" nzValue="tom"></nz-option>
    </nz-select>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
  <div>
    <app-field-label label="يوم الأجازة"></app-field-label>
    <nz-select
      nzAllowClear
      nzPlaceHolder="برجاء تحديد الأجازة .."
      class="xl-select w-full lg:min-w-[300px]"
    >
      <nz-option nzLabel="Jack" nzValue="jack"></nz-option>
      <nz-option nzLabel="Lucy" nzValue="lucy"></nz-option>
      <nz-option nzLabel="Tom" nzValue="tom"></nz-option>
    </nz-select>
  </div>
  <div class="flex items-center">
    <div class="w-full">
      <app-field placeholder="برجاء كتابة السعر .." label="سعر اليوم"> </app-field>
    </div>

    <div class="ms-4 shrink-0">
      <app-field-label label="تفعيل / تعطيل"></app-field-label>
      <nz-switch></nz-switch>
    </div>
  </div>
</div>

<div class="flex">
  <app-button class="mt-6 w-full md:w-auto" [outline]="true">
    <span class="flex items-center">
      <span nz-icon nzType="plus" class="text-lg" nzTheme="outline"></span>
      يوم جديد
    </span>
  </app-button>
</div>

<div class="flex">
  <app-button class="mt-6 w-full md:w-auto">
    <span class="flex items-center">
      <span nz-icon class="text-lg me-1 leading-none" nzType="save" nzTheme="outline"></span>
      حفظ التغييرات
    </span>
  </app-button>
</div>
