<div class="amenity-item">
  @if (symbol != null) {
    <img [src]="symbol" alt="" class="amenity-icon" />
  }
  <div class="amenity-content">
    <h4 class="amenity-name">{{ name }}</h4>
    @if (description != null) {
      <p class="amenity-description">{{ description }}</p>
    }
    @if (count != null) {
      <p class="amenity-description">{{"::Host:VacationHome:Step2:number" |abpLocalization}}: {{ count }}</p>
    }
    @if (guests != null) {
      <p class="amenity-description">{{"::Host:VacationHome:Step2:numberOfBed"|abpLocalization}} {{ guests }}</p>
    }
  </div>
</div>
