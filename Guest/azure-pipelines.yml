trigger:
  - develop

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none
  - script: |
      sshpass -p$(PASSWORD) ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $(HOST) """
      cd /root
      git clone -b develop https://$(AZURE_USERNAME):$(AZURE_PASSWORD)@dev.azure.com/idigitdev/hyyak/_git/HyyakGuestFE hyyak-guest||\ 
      cd ./hyyak-guest && git checkout develop && git pull origin develop
      """
    displayName: "Clone repo"
    env:
      HOST: $(HOST)
      PASSWORD: $(PASSWORD)
      AZURE_USERNAME: $(AZURE_USERNAME)
      AZURE_PASSWORD: $(AZURE_PASSWORD)   

  - script: |
      sshpass -p$(PASSWORD) ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $(HOST) """
      cd /root/hyyak-guest
      docker stop hyyakguest
      docker rm hyyakguest
      docker rmi hyyakguest-image
      """
    displayName: "Stopping containers and removing them"
    env:
      HOST: $(HOST)
      PASSWORD: $(PASSWORD)

  - script: |
      sshpass -p$(PASSWORD) ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $(HOST) """
      cd /root/hyyak-guest
      docker build -t hyyakguest-image -f Dockerfile.local .
      docker run -d -p 4202:80 --name=hyyakguest --hostname=hyyakguest --network=hyyak-network hyyakguest-image 
      """
    displayName: "Building and running new containers .."
    env:
      HOST: $(HOST)
      PASSWORD: $(PASSWORD)
    
  - script: |
      sshpass -p$(PASSWORD) ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $(HOST) """
      cd /root/hyyak
      docker compose -f docker-compose-apache2.yml down --rmi all -v
      docker compose -f docker-compose-apache2.yml up -d
      """
    displayName: "Restart apache web server"
    env:
      HOST: $(HOST)
      PASSWORD: $(PASSWORD)

  - script: |
      sshpass -p$(PASSWORD) ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $(HOST) """
      docker builder prune -f
      docker image prune -f
      """
    displayName: "Cleaning Docker"
    env:
      HOST: $(HOST)
      PASSWORD: $(PASSWORD)