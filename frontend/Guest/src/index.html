    // Function to handle orientation change event
    function handleOrientationChange() {
      // Force the page to remain in portrait mode
      if (window.orientation === 90 || window.orientation === -90) {
        // alert('Please rotate your device to portrait mode.');
        setTimeout(function () {
          window.scrollTo(0, 1); // Ensure the address bar is hidden in iOS
        }, 0);
      }
    }

    // Add event listener for orientation change
    window.addEventListener('orientationchange', handleOrientationChange, false);
    function handleWindowResize() {
      const userAgent = navigator.userAgent;
      if (userAgent.match(/Android/i)) {
        document.body.classList.add('landscape-message');
      } else if (userAgent.match(/iPhone|iPad|iPod/i)) {
        document.body.classList.add('landscape-message');
      } else if (userAgent.match(/Windows Phone|Windows NT/i)) {
        document.body.classList.remove('landscape-message');
      } else {
        document.body.classList.remove('landscape-message');
      }

      // Add your logic based on the window width here
    }

    // Add event listener for the 'resize' event
    window.addEventListener('resize', handleWindowResize);
    handleWindowResize();
    // Initial check for orientation when the page loads
    handleOrientationChange();
  </script>
