<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 330 560" width="330" height="560">
  <defs>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B7A75"/>
      <stop offset="100%" stop-color="#095C58"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B7A75"/>
      <stop offset="100%" stop-color="#D4A55A"/>
    </linearGradient>
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9EFEA"/>
      <stop offset="100%" stop-color="#0B7A75"/>
    </linearGradient>
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CC"/>
      <stop offset="100%" stop-color="#D4A55A"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B7A75"/>
      <stop offset="100%" stop-color="#D4A55A"/>
    </linearGradient>
    <clipPath id="phoneClip">
      <rect x="68" y="28" width="224" height="504" rx="40"/>
    </clipPath>
  </defs>

  <!-- Ghost phone (tilted, behind) -->
  <g opacity="0.45" transform="translate(-12,0) rotate(-10 104 305)">
    <rect x="0" y="90" width="208" height="430" rx="40" fill="url(#ghostGrad)" stroke="white" stroke-width="7"/>
  </g>

  <!-- Main phone bezel -->
  <rect x="64" y="24" width="232" height="512" rx="44" fill="none" stroke="white" stroke-width="8"/>

  <g clip-path="url(#phoneClip)">
    <!-- phone base -->
    <rect x="68" y="28" width="224" height="504" fill="#FAF8F2"/>

    <!-- Notch -->
    <rect x="68" y="28" width="224" height="24" fill="#FAF8F2"/>
    <rect x="164" y="38" width="32" height="4" rx="2" fill="#E5E7EB"/>

    <!-- Header bar -->
    <rect x="68" y="52" width="224" height="40" fill="#0B7A75"/>
    <circle cx="90" cy="72" r="8" fill="url(#logoGrad)"/>
    <text x="102" y="76" font-family="'Noto Naskh Arabic', serif" font-size="13" font-weight="700" fill="white">درب</text>
    <circle cx="255" cy="72" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="279" cy="72" r="10" fill="rgba(255,255,255,0.2)"/>

    <!-- Hero destination card -->
    <rect x="80" y="104" width="200" height="88" rx="16" fill="url(#heroGrad)"/>
    <text x="92" y="128" font-size="10" fill="rgba(255,255,255,0.72)">الوجهة المميزة</text>
    <text x="92" y="150" font-family="'Noto Naskh Arabic', serif" font-size="15" font-weight="700" fill="white">دمشق</text>
    <text x="92" y="168" font-size="10" fill="rgba(255,255,255,0.68)">المسجد الأموي</text>
    <circle cx="252" cy="148" r="22" fill="rgba(255,255,255,0.18)"/>
    <path d="M252 138c-3.87 0-7 3.13-7 7 0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="252" cy="145" r="2.5" fill="none" stroke="white" stroke-width="2"/>

    <!-- Search bar -->
    <rect x="80" y="202" width="200" height="36" rx="12" fill="white" stroke="rgba(11,122,117,0.1)"/>
    <circle cx="96" cy="220" r="6" fill="rgba(11,122,117,0.35)"/>
    <rect x="110" y="217" width="150" height="6" rx="3" fill="#E5E7EB"/>

    <!-- Row label + see-all -->
    <rect x="80" y="250" width="80" height="10" rx="5" fill="rgba(31,41,55,0.15)"/>
    <rect x="240" y="251" width="40" height="8" rx="4" fill="rgba(11,122,117,0.3)"/>

    <!-- Property cards -->
    <rect x="80" y="272" width="94" height="56" rx="12" fill="url(#card1Grad)"/>
    <rect x="80" y="334" width="76" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="80" y="346" width="56" height="6" rx="3" fill="#F3F4F6"/>

    <rect x="186" y="272" width="94" height="56" rx="12" fill="url(#card2Grad)"/>
    <rect x="186" y="334" width="76" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="186" y="346" width="56" height="6" rx="3" fill="#F3F4F6"/>

    <!-- CTA button -->
    <rect x="80" y="368" width="200" height="40" rx="12" fill="#0B7A75"/>
    <rect x="132" y="384" width="96" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>

    <!-- Bottom tab bar -->
    <rect x="68" y="468" width="224" height="64" fill="white"/>
    <line x1="68" y1="468" x2="292" y2="468" stroke="#F3F4F6" stroke-width="1"/>

    <circle cx="104" cy="490" r="10" fill="rgba(11,122,117,0.2)"/>
    <rect x="90" y="506" width="28" height="6" rx="3" fill="rgba(11,122,117,0.4)"/>

    <circle cx="154" cy="490" r="10" fill="#F3F4F6"/>
    <rect x="140" y="506" width="28" height="6" rx="3" fill="#E5E7EB"/>

    <circle cx="204" cy="490" r="10" fill="#F3F4F6"/>
    <rect x="190" y="506" width="28" height="6" rx="3" fill="#E5E7EB"/>

    <circle cx="254" cy="490" r="10" fill="#F3F4F6"/>
    <rect x="240" y="506" width="28" height="6" rx="3" fill="#E5E7EB"/>
  </g>
</svg>
