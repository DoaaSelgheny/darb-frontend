<div class="success-page flex flex-col items-center justify-center text-center px-6 py-16 min-h-[100vh] w-full">
  <div class="cursor-pointer" (click)="goToHome()">
    <img src="assets/imgs/logo.png" alt="logo" class="w-[125px] mb-10" />
  </div>

  <div class="success-icon flex items-center justify-center w-20 h-20 rounded-full bg-primary/10 mb-6">
    <i class="fa-solid fa-circle-check text-primary text-5xl"></i>
  </div>

  <h1 class="font-extrabold text-2xl md:text-3xl text-[#222] mb-3">
    {{ '::guest:payment:success:title' | abpLocalization }}
  </h1>

  <p class="text-base text-gray-500 max-w-md mb-10">
    {{ '::guest:payment:success:description' | abpLocalization }}
  </p>

  <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
    <button
      nz-button
      nzType="primary"
      nzSize="large"
      class="w-full sm:w-auto sm:min-w-[220px] !rounded-full"
      (click)="goToMyReservations()"
    >
      {{ '::guest:header.myBookings' | abpLocalization }}
    </button>

    <button
      nz-button
      nzType="default"
      nzSize="large"
      class="w-full sm:w-auto sm:min-w-[220px] !rounded-full border-primary text-primary hover:!text-primary hover:!border-primary"
      (click)="goToHome()"
    >
      {{ '::Guest:Explore:Home' | abpLocalization }}
    </button>
  </div>
</div>
