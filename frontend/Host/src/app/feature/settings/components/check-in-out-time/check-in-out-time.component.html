<div class="mt-3">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <app-time-picker [(ngModel)]="timeToEnter" label=" ووقت الدخول"></app-time-picker>
    <app-time-picker [(ngModel)]="timeToLeave" label=" ووقت المغادرة"></app-time-picker>
  </div>

  <div class="flex">
    <app-button (click)="saveChanges()" class="mt-6 w-full md:w-auto">
      <span class="flex items-center">
        <span nz-icon class="text-lg me-1 leading-none" nzType="save" nzTheme="outline"></span>
        حفظ التغييرات
      </span>
    </app-button>
  </div>
</div>
