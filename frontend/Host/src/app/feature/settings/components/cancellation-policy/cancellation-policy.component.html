<div class="mt-3">
  <div class="border-gray-200 rounded-lg p-4 border">
    @for (item of cancellationAndReturnPolicies; track item; let idx = $index) {
      <label
        nz-checkbox
        [(ngModel)]="item.selected"
        nzValue="{{ item.id }}"
        class="flex items-center mt-4"
      >
        <span class="text-base text-gray-600 font-bold">
          {{ item.nameAr }}
        </span>
      </label>
    }

    <div class="flex">
      <app-button (click)="getSelectedValues()" class="mt-6 w-full md:w-auto">
        <span class="flex items-center">
          <span nz-icon class="text-lg me-1 leading-none" nzType="save" nzTheme="outline"></span>
          حفظ التغييرات
        </span>
      </app-button>
    </div>
  </div>
</div>
