<h1 class="text-lg text-[#3C3C3CE3] mt-3 mb-6 font-bold">وسائل الراحه</h1>
<h3 class="text-lg text-[#3C3C3CE3] mt-3 mb-6 font-bold">وسائل المشمولة</h3>
<div class="mt-9 lg:w-4/6 w-full">
  <div class="grid grid-cols-2 gap-4">
    @for (item of means; track $index) {
    <label
      nz-checkbox
      class="flex items-center mt-4 !ml-0"
      [nzValue]="item.id"
      (nzCheckedChange)="setValue($event, item.id)"
      [nzChecked]="getValue(item.id)"
    >
      <span class="text-base text-gray-600 font-bold"> {{ item.name }} </span>
    </label>
    }
  </div>
</div>
