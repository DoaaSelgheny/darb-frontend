<nz-card  class="block relative w-full border-1 rounded-2xl border-[#E5E5E5]  rounded-lg ">
  <div class="p-4 flex items-center justify-between font-bold ">
    <p class="font-bold text-lg text-[#171717] border-0">{{'::GuestData' |abpLocalization}} </p>
  </div>
  <div class="p-4 flex items-center justify-between font-bold ">
    <p class="font-bold text-base text-[#171717] "> {{'::NameGuest' |abpLocalization}} </p>
    <p class="font-bold text-base text-[#171717] ">{{ data?.guest.name}}</p>
  </div>
  <div class="p-4 flex items-center justify-between font-bold ">
    <p class="font-bold text-base text-[#171717] "> {{'::IDnumber' |abpLocalization}}  </p>
    <p class="font-bold text-base text-[#171717] ">{{ data?.guest.nationalId  }}</p>
  </div>
  <div class="p-4 flex items-center justify-between font-bold ">
    <p class="font-bold text-base text-[#171717] ">  {{'::Contacttheguest' |abpLocalization}}  </p>
    <div class=" flex" style="direction: ltr;">
      <a [href]="'https://wa.me/'+mobile" target="_blank" class="whatsapp-icon">
        <!-- <i class="fa fa-whatsapp" style="font-size:24px; color:green;"></i>
       -->
             <i class="fa-brands fa-whatsapp" style="font-size:24px; color:green;"></i>
           
      </a>
      <div class="px-1 pt-[4px]">
        <svg  width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
      </div>
      <p class="font-bold text-base text-[#171717] ">
        {{ data?.guest.phoneNumber}}</p>
     
 
    </div>
  
  </div>
