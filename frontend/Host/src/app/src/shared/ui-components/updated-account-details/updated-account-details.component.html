@if (openUpdate) {
  <section class="w-[100vw] h-[100vh] fixed inset-0 bg-[#0B163D99] flex justify-center " style="z-index: 1000;">
    <form
      [formGroup]="form"
      class="py-9 px-4 md:px-11 md:w-[589px] rounded-md md:shadow-greyBox md:h-auto bg-white flex flex-col items-center self-center"
    >
    <!-- <div class="flex d-flex justify-end w-full" >
      <div role="button" (click)="closePopup()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.9997 5.274L11.9495 0.324219L13.3637 1.73843L8.4139 6.6882L13.3637 11.6379L11.9495 13.0521L6.9997 8.1024L2.04996 13.0521L0.635742 11.6379L5.5855 6.6882L0.635742 1.73843L2.04996 0.324219L6.9997 5.274Z" fill="#404040"/>
        </svg>

    </div> </div> -->
      <div class="flex flex-col gap-5 w-full">
        <div class="flex">
          <img
            src="/assets/host/icons/verification-icon.png"
            class="mx-auto block"
            alt="verification"
            title="verification-otp"
          />
          <button (click)="closePopup()" class="underline text-primary">
            <!-- {{ { key: '::host:otp:Close', defaultValue: 'إغلاق' } | abpLocalization }} -->
            <span nz-icon nzType="close" class="ms-2" nzTheme="outline"></span>
          </button>
        </div>

        @if (contactInfo.type == otpType.ChangePhoneNumber) {
          <div>
            <app-field-label
              label="
                    {{
                {
                  key: '::host:otp:PreviousPhoneNumber',
                  defaultValue: 'رقم الهاتف السابق'
                } | abpLocalization
              }}"
            ></app-field-label>
            <ngx-intl-tel-input
              cssClass="w-full left-direction rounded-md mt-4 p-4 ant-input ps-7 ant-input-rtl ant-input-stepperless text-dark text-base"
              [enableAutoCountrySelect]="true"
              [enablePlaceholder]="true"
              [searchCountryFlag]="true"
              [selectedCountryISO]="selectedCountryISO"
              [selectFirstCountry]="false"
              [separateDialCode]="true"
              name="phoneNumber"
              formControlName="previousPhoneNumber"
            ></ngx-intl-tel-input>
          </div>
          <div>
            <app-field-label
              [control]="form | getControl: 'newPhoneNumber'"
              label="
                      {{
                {
                  key: '::host:otp:NewPhoneNumber',
                  defaultValue: 'رقم الهاتف الجديد'
                } | abpLocalization
              }}"
            ></app-field-label>
            <ngx-intl-tel-input
              cssClass="w-full left-direction rounded-md mt-4 p-4 ant-input ps-7 ant-input-rtl ant-input-stepperless text-dark text-base"
              [onlyCountries]="onlySaudiCountry"
              [numberFormat]="PhoneNumberFormat.National"
              [enableAutoCountrySelect]="true"
              [enablePlaceholder]="false"
              [searchCountryFlag]="true"
              [selectedCountryISO]="selectedCountryISO"
              [selectFirstCountry]="false"
              [separateDialCode]="true"
              name="phoneNumber"
              formControlName="newPhoneNumber"
            ></ngx-intl-tel-input>
            <app-validation
              *ngIf="(submitted && form.controls['newPhoneNumber'].errors) ||
           form.controls['newPhoneNumber'].dirty &&    form.controls['newPhoneNumber'].touched && form.controls['newPhoneNumber'].errors
              "
              [control]="form | getControl: 'newPhoneNumber'"
              [suppressValidationWithMessage]="{
                required: 'required',
                pattern:'General:Validation.validatePhoneNumber'
              }"

            ></app-validation>
          </div>
        } @else {
          <div>
            <app-field
              [placeholder]="
                { key: '::Host:Profile:PlaceHolder:Email', defaultValue: 'البريد الإلكتروني' }
                  | abpLocalization
              "
              [label]="
                { key: '::Host:otp:PreviousEmail', defaultValue: 'البريد الإلكتروني السابق' }
                  | abpLocalization
              "
              formControlName="previousEmail"
            ></app-field>
          </div>
          <div>
            <app-field
              [control]="form | getControl: 'newEmail'"
              formControlName="newEmail"
              [placeholder]="
                { key: '::Host:Profile:PlaceHolder:Email', defaultValue: 'البريد الإلكتروني' }
                  | abpLocalization
              "
              [label]="
                { key: '::Host:otp:NewEmail', defaultValue: 'البريد الإلكتروني الجديد' }
                  | abpLocalization
              "
              [suppressValidationWithMessage]="{
                required: 'required',
                pattern:'emailError'
              }"

            ></app-field>

            <div *ngIf="emailsMatchError" class="error">
             {{'::matchEmail'|abpLocalization}}
            </div>

          </div>
        }

        <!-- SUBMIT BUTTON  -->
        <div class="w-11/12 mx-auto block mt-8 text-center">
          <button
            (click)="sendOtp()"
            class="border-primary h-14 text-white active:border-primary active:bg-primary after:bg-primary hover:bg-primary focus:border-primary focus:bg-primary bg-primary w-full mx-auto rounded-md block"
          >
            {{ { key: '::Host:Profile:Verify', defaultValue: 'تحقق' } | abpLocalization }}
          </button>
        </div>
      </div>
    </form>
  </section>
}
